services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tasks
      POSTGRES_PASSWORD: local_only_password
      POSTGRES_DB: tasks
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tasks -d tasks']
      interval: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
  api:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-local}
    environment:
      DATABASE_URL: postgres://tasks:local_only_password@db:5432/tasks
    ports: ['3000:3000']
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
